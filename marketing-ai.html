<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="FÊNIX Marketing AI — centro de comando da agência autônoma de marketing.">
  <title>FÊNIX Marketing AI</title>
  <link rel="stylesheet" href="src/styles.css">
  <style>
    body{background:radial-gradient(circle at 85% -10%,#3a1015 0,transparent 30%),#09090b}.app{grid-template-columns:260px minmax(0,1fr)}aside{background:#08080a;box-shadow:18px 0 50px #0004}.brand{padding:4px 4px 14px}.brand b{letter-spacing:.5px}.brand span{color:#e0b94b}nav{gap:6px}nav button{width:100%;display:block;background:none;border:0;color:#a9a9b2;text-align:left;padding:12px 14px;border-radius:11px;cursor:pointer;font:inherit}nav button:hover,nav button.active{background:#1b1b20;color:#fff}main{max-width:1500px;padding:30px 34px 60px}header{padding-bottom:18px;border-bottom:1px solid #202026}header h1{font-size:28px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;background:linear-gradient(135deg,#1a1517,#111114 60%);border:1px solid #343037;border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 24px 80px #0003}.hero h2{margin:6px 0 7px;font-size:26px}.hero p{margin:0;color:#b8b8c0;max-width:850px}.eyebrow{font-size:10px;letter-spacing:2.2px;color:#d5af36;font-weight:700}.agent-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.agent{background:linear-gradient(180deg,#15151a,#101014);border:1px solid #2b2b32;border-radius:13px;padding:15px;min-height:82px}.agent b{display:block;margin-bottom:6px}.agent span{font-size:12px;color:#a9a9b2}.ok{color:#7ddc9b}.danger{color:#ff8585}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.empty{padding:30px;text-align:center;color:#9999a4}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#65d98c;box-shadow:0 0 18px #65d98c80;margin-right:8px}.strategy{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.strategy div{background:#101014;border:1px solid #292930;border-radius:10px;padding:13px}.strategy strong{display:block;color:#d5af36;font-size:11px;margin-bottom:5px}.login{max-width:540px;margin:7vh auto}.auth-card{text-align:left;padding:28px}.auth-card h2{text-align:center;margin:4px 0 8px}.auth-card>p{text-align:center;color:#aaaab3}.auth-mark{text-align:center;font-size:44px;margin-bottom:6px}.notice{border-left:3px solid #d5af36;padding:11px 13px;background:#181817;border-radius:8px;color:#d4d4d8}.mini{font-size:12px;color:#9d9da7}.task-actions{display:flex;gap:6px;flex-wrap:wrap}.task-actions button{padding:7px 9px;font-size:12px}.section-title{display:flex;justify-content:space-between;gap:12px;align-items:center}.section-title h3{margin:0}.pill{display:inline-block;border:1px solid #34343c;padding:4px 9px;border-radius:999px;font-size:11px;color:#c7c7ce}.loading{opacity:.65;pointer-events:none}.table-wrap{overflow:auto;margin-top:12px}.password-wrap{display:grid;grid-template-columns:1fr auto;gap:8px}.icon-btn{white-space:nowrap}.toast{position:fixed;right:18px;bottom:18px;max-width:420px;background:#1d1d22;border:1px solid #3c3c45;padding:13px 16px;border-radius:12px;display:none;z-index:20;box-shadow:0 16px 45px #0008}.toast.show{display:block}.toast[data-type="success"]{border-color:#2c7444}.toast[data-type="error"]{border-color:#8b3434}.metrics{grid-template-columns:repeat(6,minmax(0,1fr))}.metric{min-height:100px;display:flex;flex-direction:column;justify-content:space-between}.metric b{font-size:30px}.formgrid{margin-top:14px}.actions{flex-wrap:wrap}.auth-actions button{flex:1}.badge{border:1px solid #33333a;background:#202027}.panel{box-shadow:0 12px 35px #0002}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d5af36;outline-offset:2px}
    @media(max-width:1150px){.metrics{grid-template-columns:repeat(3,1fr)}.agent-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:850px){.app{grid-template-columns:1fr}aside{position:sticky;top:0;z-index:5;padding:10px 12px;border-right:0;border-bottom:1px solid #28282f}.brand{margin:0 0 8px}.brand span{display:inline;margin-left:6px}nav{display:flex;overflow:auto;gap:6px;padding-bottom:2px}nav button{width:auto;white-space:nowrap;padding:9px 11px;background:#111116}main{padding:18px 14px 50px}header{align-items:flex-start}.hero{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){header{display:flex;gap:12px}header h1{font-size:22px}.agent-grid,.strategy,.formgrid,.metrics{grid-template-columns:1fr}.wide{grid-column:auto}.hero h2{font-size:22px}.hero button{width:100%}.section-title{align-items:flex-start;flex-direction:column}.toolbar{width:100%}.toolbar select,.toolbar button{flex:1}.auth-card{padding:20px}.auth-actions{display:grid}.password-wrap{grid-template-columns:1fr}.password-wrap button{width:100%}.toast{left:12px;right:12px;bottom:12px;max-width:none}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">🐦‍🔥 <b>FÊNIX</b><span>MARKETING AI</span></div>
    <nav id="marketingNav" aria-label="Navegação principal">
      <button data-view="dashboard" class="active">Centro de Comando</button>
      <button data-view="clients">Clientes</button>
      <button data-view="campaigns">Campanhas</button>
      <button data-view="tasks">Agentes & Tarefas</button>
      <button data-view="content">Conteúdo</button>
    </nav>
  </aside>
  <main>
    <header>
      <div><h1 id="marketingTitle">Centro de Comando</h1><p>Agência autônoma de marketing da Fênix Warriors</p></div>
      <div class="toolbar"><span class="mini" id="userLabel"></span><button class="secondary" id="logoutBtn" style="display:none">Sair</button></div>
    </header>
    <section id="marketingView"><div class="panel"><p>Carregando...</p></div></section>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="src/supabase-config.js"></script>
<script src="src/marketing-ai.js"></script>
</body>
</html>
