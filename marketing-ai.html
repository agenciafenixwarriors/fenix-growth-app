<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>FÊNIX Marketing AI</title>
  <link rel="stylesheet" href="src/styles.css">
  <style>
    .hero{background:linear-gradient(135deg,#17171c,#111114);border:1px solid #34343c;border-radius:18px;padding:22px;margin-bottom:18px}.hero h2{margin:0 0 6px;font-size:25px}.hero p{margin:0;color:#a9a9b2;max-width:850px}.agent-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.agent{background:#111115;border:1px solid #2b2b32;border-radius:12px;padding:14px}.agent b{display:block;margin-bottom:5px}.agent span{font-size:12px;color:#a9a9b2}.ok{color:#66d68b}.warn{color:#f2c94c}.danger{color:#ff7070}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar a{text-decoration:none}.empty{padding:28px;text-align:center;color:#a9a9b2}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#66d68b;margin-right:7px}.strategy{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.strategy div{background:#101014;border:1px solid #292930;border-radius:10px;padding:12px}.strategy strong{display:block;color:#d5af36;font-size:12px;margin-bottom:5px}.login{max-width:520px;margin:8vh auto}.notice{border-left:3px solid #d5af36;padding:11px 13px;background:#181817;border-radius:8px;color:#d4d4d8}.mini{font-size:12px;color:#a9a9b2}.task-actions{display:flex;gap:6px}.task-actions button{padding:7px 9px;font-size:12px}.navlink{text-decoration:none}.section-title{display:flex;justify-content:space-between;gap:12px;align-items:center}.section-title h3{margin:0}.pill{display:inline-block;border:1px solid #34343c;padding:4px 8px;border-radius:999px;font-size:11px}.loading{opacity:.7;pointer-events:none}.toast{position:fixed;right:18px;bottom:18px;max-width:420px;background:#1d1d22;border:1px solid #3c3c45;padding:13px 16px;border-radius:12px;display:none;z-index:20;box-shadow:0 16px 45px #0008}.toast.show{display:block}@media(max-width:980px){.agent-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.agent-grid,.strategy{grid-template-columns:1fr}.section-title{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">🐦‍🔥 <b>FÊNIX</b><span>MARKETING AI</span></div>
    <nav id="marketingNav">
      <button data-view="dashboard" class="active">Centro de Comando</button>
      <button data-view="clients">Clientes</button>
      <button data-view="campaigns">Campanhas</button>
      <button data-view="tasks">Agentes & Tarefas</button>
      <button data-view="content">Conteúdo</button>
      <a class="navlink" href="admin.html"><button style="width:100%">CRM</button></a>
      <a class="navlink" href="analytics.html"><button style="width:100%">Analytics</button></a>
      <a class="navlink" href="index.html"><button style="width:100%">Growth OS</button></a>
    </nav>
  </aside>
  <main>
    <header>
      <div><h1 id="marketingTitle">Centro de Comando</h1><p>Agência autônoma de marketing da Fênix Warriors</p></div>
      <div class="toolbar"><span class="mini" id="userLabel"></span><button class="secondary" id="logoutBtn" style="display:none">Sair</button></div>
    </header>
    <section id="marketingView"><div class="panel"><p>Carregando...</p></div></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="src/supabase-config.js"></script>
<script src="src/marketing-ai.js"></script>
<script src="src/password-recovery.js"></script>
</body>
</html>
